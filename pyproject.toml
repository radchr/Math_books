[project]
name = "math-books"
version = "0.1.0"
description = "STEM-Basketball 9:16 vertical video pipeline (Manim + Gemini TTS) and math book digitization tools"
readme = "README.md"
authors = [
    { email = "pochta.roman.r.git@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "edge-tts>=7.2.8",
    "gradio-client>=2.7.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "lxml>=6.0.0",
    "manim>=0.22.1",
    "numpy>=2.0.0",
    "num2words>=0.5.14",
    "pillow>=11.0.0",
    "pymorphy3>=2.0.3",
    "python-dotenv>=1.2.4",
    "snowballstemmer>=3.0.1",
    "sympy>=1.14.0",
]

[project.scripts]
math-books = "math_books.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "pre-commit>=4.0",
    "ruff>=0.11.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".agents", "archive_*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

[[tool.ty.overrides]]
include = [
    "src/math_books/*_scene.py",
    "src/math_books/video_ui.py",
    "src/math_books/visual_blocks/*.py",
    "src/math_books/packs/**/*.py",
]
[tool.ty.overrides.rules]
# Manim's Point3DLike / ManimColor stubs reject standard list[float] coordinates and color defaults
invalid-argument-type = "ignore"
invalid-parameter-default = "ignore"
not-iterable = "ignore"

[[tool.ty.overrides]]
include = ["tests/**"]
[tool.ty.overrides.rules]
# Tests intentionally pass SimpleNamespace stubs and dynamic dicts
invalid-argument-type = "ignore"
no-matching-overload = "ignore"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
